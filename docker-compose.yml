version: '3.8'

services:
  mimir:
    build: .
    container_name: mimir-v10
    restart: unless-stopped
    ports:
      # P0-K (dudu RED-4): loopback default. LAN/WAN exposure requires
      # explicitly changing to "0.0.0.0:8456:8456" + your own ingress
      # boundary (reverse proxy / TLS / token at deploy side).
      - "127.0.0.1:8456:8456"
    environment:
      # container must listen on all interfaces for compose networking;
      # the loopback guard applies at the published-port mapping above.
      - MIMIR_ALLOW_NONLOOPBACK=1
      - MIMIR_V8_DATA_DIR=/data/canonical.db
      - MIMIR_V8_TOKEN_FILE=/data/api_tokens.json
      - MIMIR_V8_COLLECTION=mimir_v10_prod_local
      - MIMIR_V8_MODEL=BAAI/bge-m3
      - MIMIR_V9_KNOWLEDGE_LAYERS=memory,learning,wiki
      - MIMIR_GOVERNANCE_MODEL=${MIMIR_GOVERNANCE_MODEL:-default-model}
      - HF_HUB_OFFLINE=1
      - TOKENIZERS_PARALLELISM=false
    volumes:
      - mirdata:/data
      - mirmodels:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8456/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  mimir-dashboard:
    # P0-K (dudu RED-5): deps installed at BUILD time via dashboard/Dockerfile
    # (pinned requirements.txt); runtime runs a fixed entrypoint only — no
    # per-start PyPI pulls of unlocked versions.
    build:
      context: ./dashboard
    container_name: mimir-dashboard
    restart: unless-stopped
    depends_on:
      - mimir
    ports:
      - "127.0.0.1:8800:8800"
    environment:
      - MIMIR_API=http://mimir:8456
      - CANONICAL_DB=/data/canonical.db
      - ADMIN_TOKEN_FILE=/data/admin.token
      - FRONTEND_DIR=/app/frontend
      - PORT=8800
    volumes:
      - ./dashboard/backend:/app/backend
      - ./dashboard/frontend:/app/frontend
      - mirdata:/data

volumes:
  mirdata:
  mirmodels: