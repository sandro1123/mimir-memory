# Mímir ruff 配置（2026-10-11 建，roadmap #23 第一期）。
#
# 为什么不是「直接去掉 || true」
# --------------------------------
# CI 的 lint 作业原先长这样：
#
#     - run: ruff check mimir_v8/ || true
#
# 一个永远不会失败的作业。可信底座项目不留永远绿灯的门。但不能直接删掉
# `|| true` —— 实测默认规则集下有 **414** 个错误，直接删会让 CI 红在
# 200+ 个风格现代化规则上，把真 bug 埋掉。
#
# 分期
# ----
# 第一期（本文件）：`E9,F821`。
#   实测基线 = **0**（All checks passed），故去 `|| true` 零债务可立刻生效。
#   E9 = 语法错误类（原 pycodestyle E9：语法错误、无效转义等）。
#   F821 = undefined-name —— 那才是「会让程序跑不起来」的主力。
#
#   第二期（roadmap #23 续）：F401/F841/F541/F811 等清洁类共 80 个
#   （F401 66 / F841 8 / F541 4 / F811 2，其中 72 个可 --fix 自动修），
#   清零后再纳入本配置。
#
# 反向验证记录（双向，缺一则门禁不可信）
# ------------------------------------
# - 塞合法代码        → All checks passed, exit 0   （不能一律红）
# - 塞 undefined name → F821 caught, exit 1         （不能一律绿）
# 曾先用 `E9` 单条，反向验证**失败**：F821 不在 E9 内（E9 是 pycodestyle
# 语法类，F 属 pyflakes），注入未定义名仍报 All checks passed。
# 即"只选 E9"这道门对最想抓的错**零守护** —— 故改为 E9,F821。
#
# 刻意排除
# --------
# 默认集的 UP017(20) / UP035(11) / UP009(3) 等是风格现代化；
# B008(164) 是 FastAPI `Depends()` 依赖注入的框架惯用法，不是缺陷。
# 数量大、收益低，且会淹没真问题 —— 故本期不开，需要时另行立项。
#
# 注意：本文件是独立 ruff.toml，段名不用 [tool.ruff]（那是 pyproject 专用）。

# 目标版本与 pyproject 的 requires-python >=3.11 对齐
target-version = "py311"
# 行宽：本仓中文注释与长 URL 较多，格式问题不属本卡范围，故放宽
line-length = 200

[lint]
# 第一期：只查会让程序跑不起来的类别。
# 第二期（2026-10-26 审计）：清洁类 F 全量清零后并入；B023（闭包捕获循环变量）
# 与 B904（except 内 raise 未带 from，吞掉根因）同步清零并纳入。
select = ["E9", "F", "B023", "B904"]
