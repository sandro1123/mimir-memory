name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least privilege: no job needs to write to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Actions pinned by commit SHA (tag in comment) against tag hijacking.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[embeddings]
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          MIMIR_HOME: ${{ runner.temp }}/mimir-test
        # Live-system benchmarks (tests/test_r9_eval.py) only run with
        # MIMIR_LIVE_EVAL=1 against a running API; they are skipped here.
        run: |
          pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        # 第二期规则集见 ruff.toml：E9 + 全量 F + B023 + B904，基线 0。
        run: ruff check mimir_v8/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install bandit pip-audit
      - name: Bandit (high severity, high confidence)
        run: bandit -r mimir_v8 dashboard/backend hermes-plugin -q -lll -iii
      - name: Dependency audit
        # chromadb advisories have no fixed release and target Chroma's HTTP
        # server / RBAC provider, which Mímir does not run (embedded client
        # only). Re-evaluate whenever chromadb ships a fix.
        run: |
          pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  release-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Release hygiene scan (P0-C seven-face gate)
        run: python scripts/release_scan.py

  version-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Version registry sweep
        # Guards the v1.6.0 codename-table miss: every derived registry
        # (schema.py / pyproject / PULSE CODENAMES / ARCHITECTURE header /
        # release-identity assertion / README production labels) must agree
        # with MIMIR_VERSION, or a version bump silently ships a stale label.
        run: python scripts/version_sweep.py
